name: Build NiLoFi Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ☕ Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🟢 Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 📱 Accept Android SDK Licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: 📦 Install Node Dependencies
        run: npm install --legacy-peer-deps

      - name: ⚙️ Expo Prebuild (Generate Native Android Project)
        run: npx --yes expo prebuild --platform android --clean

      - name: 🔐 Setup Signing Keystore
        run: |
          mkdir -p android/app
          keytool -genkey -v \
            -keystore android/app/debug.keystore \
            -alias androiddebugkey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass android \
            -keypass android \
            -dname "CN=NiLoFi, OU=Audio, O=Farhan T. Niloy, L=Dhaka, C=BD" || true

            - name: 🔨 Build Standalone Release APK via Gradle
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: 📦 Prepare Output Artifact
        run: |
          mkdir -p build-output
          cp android/app/build/outputs/apk/release/app-release.apk build-output/NiLoFi-v1.0.0.apk

      - name: 🚀 Upload Installable APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NiLoFi-Android-APK
          path: build-output/NiLoFi-v1.0.0.apk
          retention-days: 30
